<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>WeatherApp</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/teststyles.css">
    <link rel="stylesheet" href="css/animation.css">

    <!-- JS -->
    <script type="module" src="js/main.js"></script>
  </head>

  <body>
    <div id="weather-bg">
    </div>
    <div class="page-wrapper">
      <!-- CENTER -->
      <div class="row center-box">
        <div class="col-12 text-center text-backdrop">
          <div class="row hero2">
            <div id="locationtext" class="col-12 text-center">
              THE WEATHER TODAY IS 
            </div>
          </div>
          <div id="maintext" class="tracking-in-contract hero10"></div>
        </div>
      </div>
      <!-- FOOTER -->
      <div class="row text-center footer-box">
        <div class="info-box text-backdrop-card">
          <!-- Day -->
          <div class="row">
            <div class="col-12">
              <div class="row"> 
                <div class="col-12">
                  <img id="icon-day" class="info-main-icon">
                </div>
              </div>
              <div class="row"> 
                <div id="current-time" class="col-12" style="font-size: 30px;">
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="info-box text-backdrop-card">
          <!-- Temperature -->
          <div class="row">
            <div class="col-12">
              <div class="row"> 
                <div class="col-12">
                  <img id="icon-temp" class="info-main-icon" src="/resources/svg/temperature.svg" alt="wind"/>
                </div>
              </div>
              <div class="row"> 
                <div class="col-6">
                  Temp.:
                </div>
                <div id="temp-real" class="col-6"></div>
              </div>
              <div class="row"> 
                <div class="col-6">
                  Feels like:
                </div>
                <div id="temp-feel" class="col-6"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="info-box text-backdrop-card">
          <!-- Wind -->
          <div class="row">
            <div class="col-12">
              <div class="row"> 
                <div class="col-12">
                   <img id="icon-wind" class="info-main-icon" src="/resources/svg/wind.svg" alt="wind"/>
                </div>
              </div>
              <div class="row"> 
                <div class="col-6">
                  Direction:
                </div>
                <div id="wind-dir" class="col-6"></div>
              </div>
              <div class="row"> 
                <div class="col-6">
                  W. Gust:
                </div>
                <div id="wind-gust" class="col-6"></div>
              </div>
              <div class="row"> 
                <div class="col-6">
                  W. Speed:
                </div>
                <div id="wind-speed" class="col-6"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="info-box text-backdrop-card">
          <!-- Atmosphere -->
          <div class="row">
            <div class="col-12">
              <div class="row"> 
                <div class="col-12">
                  <img id="icon-atmos" class="info-main-icon" src="/resources/svg/atmosphere.svg" alt="wind"/>
                </div>
              </div>
              <div class="row"> 
                <div class="col-6">
                  Humidtiy:
                </div>
                <div id="humidity" class="col-6"></div>
              </div>
              <div class="row"> 
                <div class="col-6">
                  Sea Level:
                </div>
                <div id="sea-pressure" class="col-6"></div>
              </div>
              <div class="row"> 
                <div class="col-6">
                  Surface:
                </div>
                <div id="surface-pressure" class="col-6"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="info-box text-backdrop-card">
          <!-- Precipitation -->
          <div class="row">
            <div class="col-12">
              <div class="row"> 
                <div class="col-12">
                  <img id="icon-atmos" class="info-main-icon" src="/resources/svg/precipitation.svg" alt="wind"/>
                </div>
              </div>
              <div class="row"> 
                <div id="precipitation-type" class="col-12"></div>
              </div>
              <div class="row"> 
                <div id="precipitation"  class="col-12"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="info-box text-backdrop-card">
          <!-- Cloud -->
          <div class="row">
            <div class="col-12">
              <div class="row"> 
                <div class="col-12">
                   <img id="icon-cloud" class="info-main-icon" src="/resources/svg/cloud-svgrepo-com.svg" alt="wind"/>
                </div>
              </div>
              <div class="row"> 
                <div class="col-12">
                  Cloud Cover:
                </div>
              </div>
              <div class="row"> 
                <div id="cloud-cover" class="col-12"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
