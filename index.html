<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>HTML 5 Boilerplate</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/teststyles.css">
    <link rel="stylesheet" href="css/animation.css">

    <!-- JS -->
    <script type="module" src="js/main.js"></script>
  </head>

  <body>
    <!-- <div class="test-border" style="--border-thickness: 1px; --border-color: blue;">
        THE WEATHER TODAY IS
    </div> -->
    <div id="weather-bg">
  
    </div>
    <div class="page-wrapper">
      <!-- CENTER -->
      <div class="row center-box">
        <div class="col-12 text-center text-backdrop">
          <div class="row hero2">
            <div id="locationtext" class="col-12 text-center">
              THE WEATHER TODAY IS 
            </div>
          </div>
          <div id="maintext" class="tracking-in-contract hero10">
            
          </div>
        </div>
      </div>
      <!-- FOOTER -->
      <div class="row text-center footer-box test-border text-backdrop" style="--border-thickness: 1px; --border-color: pink;">
        <div class="info-box test-border" style="--border-thickness: 1px; --border-color: red;">
          <!-- Temperature -->
          <div class="row test-border" style="--border-thickness: 1px; --border-color: green;"> 
            <div class="col-12">
              <div class="row"> 
                <div class="col-12 test-border" style="--border-thickness: 1px; --border-color: blue;">
                  <img id="icon-temp" class="info-main-icon test-border" src="/resources/svg/temperature.svg" alt="wind" style="--border-thickness: 1px; --border-color: blue;" />
                </div>
              </div>
              <div class="row"> 
                <div class="col-6 test-border" style="--border-thickness: 1px; --border-color: blue;">
                  Temp.:
                </div>
                <div id="temp-real" class="col-6 test-border" style="--border-thickness: 1px; --border-color: blue;"></div>
              </div>
              <div class="row"> 
                <div class="col-6 test-border" style="--border-thickness: 1px; --border-color: blue;">
                  Feels like:
                </div>
                <div id="temp-feel" class="col-6 test-border" style="--border-thickness: 1px; --border-color: blue;"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="info-box test-border" style="--border-thickness: 1px; --border-color: red;">
          <!-- Wind -->
          <div class="row test-border" style="--border-thickness: 1px; --border-color: green;"> 
            <div class="col-12">
              <div class="row"> 
                <div class="col-12 test-border" style="--border-thickness: 1px; --border-color: blue;">
                   <img id="icon-wind" class="info-main-icon test-border" src="/resources/svg/wind.svg" alt="wind" style="--border-thickness: 1px; --border-color: blue;" />
                </div>
              </div>
              <div class="row"> 
                <div class="col-6 test-border" style="--border-thickness: 1px; --border-color: pink;">
                  Direction:
                </div>
                <div id="wind-dir" class="col-6 test-border" style="--border-thickness: 1px; --border-color: pink;"></div>
              </div>
              <div class="row"> 
                <div class="col-6 test-border" style="--border-thickness: 1px; --border-color: pink;">
                  Wind Gust:
                </div>
                <div id="wind-gust" class="col-6 test-border" style="--border-thickness: 1px; --border-color: pink;"></div>
              </div>
              <div class="row"> 
                <div class="col-6 test-border" style="--border-thickness: 1px; --border-color: pink;">
                  Wind Speed:
                </div>
                <div id="wind-speed" class="col-6 test-border" style="--border-thickness: 1px; --border-color: pink;"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="info-box test-border" style="--border-thickness: 1px; --border-color: red;">
          <!-- Atmosphere -->
          <div class="row test-border" style="--border-thickness: 1px; --border-color: green;"> 
            <div class="col-12">
              <div class="row"> 
                <div class="col-12 test-border" style="--border-thickness: 1px; --border-color: blue;">
                  <img id="icon-atmos" class="info-main-icon test-border" src="/resources/svg/atmosphere.svg" alt="wind" style="--border-thickness: 1px; --border-color: blue;" />
                </div>
              </div>
              <div class="row"> 
                <div class="col-6 test-border" style="--border-thickness: 1px; --border-color: pink;">
                  Humidtiy:
                </div>
                <div id="humidity" class="col-6 test-border" style="--border-thickness: 1px; --border-color: pink;"></div>
              </div>
              <div class="row"> 
                <div class="col-6 test-border" style="--border-thickness: 1px; --border-color: pink;">
                  Sea Level:
                </div>
                <div id="sea-pressure" class="col-6 test-border" style="--border-thickness: 1px; --border-color: pink;"></div>
              </div>
              <div class="row"> 
                <div class="col-6 test-border" style="--border-thickness: 1px; --border-color: pink;">
                  Surface:
                </div>
                <div id="surface-pressure" class="col-6 test-border" style="--border-thickness: 1px; --border-color: pink;"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="info-box test-border" style="--border-thickness: 1px; --border-color: red;">
          <!-- Precipitation -->
          <div class="row test-border" style="--border-thickness: 1px; --border-color: green;"> 
            <div class="col-12">
              <div class="row"> 
                <div class="col-12 test-border" style="--border-thickness: 1px; --border-color: blue;">
                  <img id="icon-atmos" class="info-main-icon test-border" src="/resources/svg/precipitation.svg" alt="wind" style="--border-thickness: 1px; --border-color: blue;" />
                </div>
              </div>
              <div class="row"> 
                <div id="precipitation-type" class="col-12 test-border" style="--border-thickness: 1px; --border-color: pink;"></div>
              </div>
              <div class="row"> 
                <div id="precipitation"  class="col-12 test-border" style="--border-thickness: 1px; --border-color: pink;"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="info-box test-border" style="--border-thickness: 1px; --border-color: red;">
          <!-- Cloud -->
          <div class="row test-border" style="--border-thickness: 1px; --border-color: green;"> 
            <div class="col-12">
              <div class="row"> 
                <div class="col-12 test-border" style="--border-thickness: 1px; --border-color: blue;">
                   <img id="icon-cloud" class="info-main-icon test-border" src="/resources/svg/cloud-svgrepo-com.svg" alt="wind" style="--border-thickness: 1px; --border-color: blue;" />
                </div>
              </div>
              <div class="row"> 
                <div class="col-6 test-border" style="--border-thickness: 1px; --border-color: pink;">
                  Cloud Cover:
                </div>
                <div id="cloud-cover" class="col-6 test-border" style="--border-thickness: 1px; --border-color: pink;"></div>
              </div>
            </div>
          </div>
        </div>
        
      </div>
    </div>
  </body>
</html>
